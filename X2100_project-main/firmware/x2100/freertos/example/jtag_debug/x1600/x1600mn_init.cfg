	#DDRP_INNOPHY_DQ_WIDTH
	mww 0xb301107c 0x3

	#DDRP_INNOPHY_MEM_CFG
	#mww 0xb3011004 0x13
	mww 0xb3011004 $DDRP_MEMCFG_VALUE

	#DDRP_INNOPHY_CL
 	set value [expr [mrw 0xb3011014] & ~0xf | $DDRP_CL_VALUE]
	mww 0xb3011014 $value

	#DDRP_INNOPHY_CWL
	set value [expr [mrw 0xb301101c] &  ~0xf | $DDRP_CWL_VALUE]
	mww 0xb301101c $value

	#DDRP_INNOPHY_AL
	set value [expr [mrw 0xb3011018] &  ~0xf]
	mww 0xb3011018 $value

	#DDRC_CTRL
	set value [expr [mrw 0xb34f0008] &  ~(1 << 20)]
	mww 0xb34f0008 $value

	#DDRP_INNOPHY_PLL_FBDIV
	set value [expr [expr [mrw 0xb3011080] &  ~0xff] | 0x10]
	#mww 0xb34f1080 $value
	mww 0xb3011080 $value

	#DDRP_INNOPHY_PLL_CTRL
	set value [expr [mrw 0xb3011084] | 0x2]
	#mww 0xb34f1084 $value
	mww 0xb3011084 $value

	#DDRP_INNOPHY_PLL_PDIV
	set value [expr [expr [mrw 0xb3011088] & ~0xff] | 0x24]
	#mww 0xb34f1088 $value
	mww 0xb3011088 $value

	sleep 100

	#DDRP_INNOPHY_PLL_CTRL
	#set value [expr [mrw 0xb34f1084] & ~(0x1 << 1)]
	set value [expr [mrw 0xb3011084] & ~(0x1 << 1)]
	mww 0xb3011084 $value

	sleep 100

	while { [expr !([mrw 0xb3011108] & (1 << 3))] } {
		sleep 1
	}

	sleep 100

	while { [expr !([mrw 0xb301208c] & (1 << 2))] } {
		sleep 1
	}
	sleep 100
}

proc ddrc_lmr_mr_ddr3 { ddr_mrn_value } {
	set ret [expr $ddr_mrn_value | 0x1 | (2 << 3) | (($ddr_mrn_value & 0xffff) << 12) | ((($ddr_mrn_value >> 16) & 0x7) << 8)]
	return $ret
}

proc ddrc_lmr_mr_lpddr2 { ddr_mrn_value } {
	set ret [expr 0x0 | (1 << 0) | (2 <<3) | (($ddr_mrn_value & 0xff) << 24) | ((($ddr_mrn_value >> 8) & 0xff) << 16)]
	return $ret
}

proc ddrc_lmr_mr_ddr2 { ddr_mrn_value } {
	set ret [expr 0x0 | (1 << 0) | (2 <<3) | ((($ddr_mrn_value >> 13) & 0x3) << 8) | (($ddr_mrn_value & 0x1fff) << 12)]
	return $ret
}

#proc ddrc_dfi_init { current_ddr_type } {

proc ddrc_dfi_init { } {
	global DDR3
	global LPDDR2
	global DDR_APB_PHY_INIT
	global DDRC_CFG_VALUE
	global DDR_MR0_VALUE
	global DDR_MR1_VALUE


	set current_ddr_type 0x4
	#start high
	#mww 0xb3012208 0x1
	mww $DDR_APB_PHY_INIT 0x1
	#start low
	#mww 0xb3012208 0x0
	mww $DDR_APB_PHY_INIT 0x0
	#polling dfi init comp

	while { ![expr [mrw 0xb301208c] & (0x1 << 1)] } {
		set value [mrw 0xb301208c]
		puts "dfi init value : $value"
		sleep 1
	}

	#set dfi_reset_n high
	set reg [expr [mrw 0xb34f0008] | (1 << 23)]
	mww 0xb34f0008 $reg

	#DDRC_CFG
	#mww 0xb34f0004 0x0a6a8a40
	mww 0xb34f0004 $DDRC_CFG_VALUE
	#set CKE to high
	mww 0xb34f0008 [expr 1 << 1]

	#DDRC_LMR send all bank precharge
	mww 0xb34f000c [expr (7 << 8) | (1 << 0)]

	sleep 100
	if { ($current_ddr_type == $DDR3) } {

		puts "init DDR3"
		set ddrc_lmr_mr_0 [ddrc_lmr_mr_ddr3 0x00000000 ]
		set ddrc_lmr_mr_1 [ddrc_lmr_mr_ddr3 0x00000183 ]
		set ddrc_lmr_mr_2 [ddrc_lmr_mr_ddr3 0x00000204 ]
		set ddrc_lmr_mr_3 [ddrc_lmr_mr_ddr3 0x00000302 ]
		#MR0
		mww 0xb34f000c $ddrc_lmr_mr_0
		#MR1
		mww 0xb34f000c $ddrc_lmr_mr_1
		#MR2
		mww 0xb34f000c $ddrc_lmr_mr_2
		#MR3
		mww 0xb34f000c $ddrc_lmr_mr_3

		mww 0xb34f000c [expr 0x0 | (0x4 << 3) | 0x1]
	} elseif { $current_ddr_type == $LPDDR2} {
		puts "LPDDR2************************"
		set ddrc_lmr_mr_63 [ddrc_lmr_mr_lpddr2 0x00003f00]
		set ddrc_lmr_mr_10 [ddrc_lmr_mr_lpddr2 0x00000aff]
		set ddrc_lmr_mr_1  [ddrc_lmr_mr_lpddr2 0x00000183]
		set ddrc_lmr_mr_2  [ddrc_lmr_mr_lpddr2 0x00000204]
		set ddrc_lmr_mr_3  [ddrc_lmr_mr_lpddr2 0x00000302]
		puts "ddrc_lmr_mr_63 $ddrc_lmr_mr_63"
		puts "ddrc_lmr_mr_10 $ddrc_lmr_mr_10"
		puts "ddrc_lmr_mr_1 $ddrc_lmr_mr_1"
		puts "ddrc_lmr_mr_2 $ddrc_lmr_mr_2"
		puts "ddrc_lmr_mr_3 $ddrc_lmr_mr_3"

		#set MRS reset
		mww 0xb34f000c $ddrc_lmr_mr_63
		sleep 100
		#set IO calibration
		mww 0xb34f000c $ddrc_lmr_mr_10
		sleep 100
		#set MR1
		mww 0xb34f000c $ddrc_lmr_mr_1
		sleep 100
		#set MR2
		mww 0xb34f000c $ddrc_lmr_mr_2
		sleep 100
		#set MR3
		mww 0xb34f000c $ddrc_lmr_mr_3
		sleep 100
	} else {

		puts "init DDR2 *************************"
		set ddrc_lmr_mr_0 [ddrc_lmr_mr_ddr2 $DDR_MR0_VALUE]
		set ddrc_lmr_mr_1 [ddrc_lmr_mr_ddr2 $DDR_MR1_VALUE]
		set lvddr2_special_mr_1 [expr $ddrc_lmr_mr_1 | 0x1000000]

		puts "ddrc_lmr_mr_0 $ddrc_lmr_mr_0"
		puts "lvddr2_special_mr_1 $lvddr2_special_mr_1"
		mww 0xb34f000c $ddrc_lmr_mr_0
		#mww 0xb34f000c $ddrc_lmr_mr_1
		mww 0xb34f000c $lvddr2_special_mr_1

		mww 0xb34f000c 0x80211
		sleep 20
		mww 0xb34f000c 0x1fff211
		sleep 20

		# all bank precharge
		#mww 0xb34f000c [expr (7 << 8) | (1 << 0)]
		#sleep 20

		# auto refresh.
		#mww 0xb34f000c [expr (1 << 3) | (1 << 0)]
		#sleep 20
		
		#mww 0xb34f000c [expr (1 << 3) | (1 << 0)]
		#sleep 20

		#mww 0xb34f000c 0x0
		#mww 0xb34f000c 0x311

		#mww 0xb34f000c 0x0
		#mww 0xb34f000c 0x111

		#mww 0xb34f000c 0x0
		#set reg [expr (0x0 << 12) | 0x11]
		#mww 0xb34f000c $reg
		#mww 0xb34f000c 0x0
	}
}

proc ddrc_timing { n } {
	set value [expr 0x60 + 4 * ($n - 1)]
	return $value
}

proc ddrc_prev_init { } {
	global DDRC_TIMING1_VALUE
	global DDRC_TIMING2_VALUE
	global DDRC_TIMING3_VALUE
	global DDRC_TIMING4_VALUE
	global DDRC_TIMING5_VALUE
	global DDRC_TIMING6_VALUE
	global DDRC_MMAP0_VALUE
	global DDRC_MMAP1_VALUE
	global DDRC_MMAP0
	global DDRC_MMAP1
	global DDRC_CTRL_VALUE
	global DDRC_CTRL

	ddr_writel $DDRC_TIMING1_VALUE	[ddrc_timing 1]
	ddr_writel $DDRC_TIMING2_VALUE	[ddrc_timing 2]
	ddr_writel $DDRC_TIMING3_VALUE	[ddrc_timing 3]
	ddr_writel $DDRC_TIMING4_VALUE	[ddrc_timing 4]
	ddr_writel $DDRC_TIMING5_VALUE	[ddrc_timing 5]
	ddr_writel $DDRC_TIMING6_VALUE	[ddrc_timing 6]

	ddr_writel $DDRC_MMAP0_VALUE $DDRC_MMAP0
	ddr_writel $DDRC_MMAP1_VALUE $DDRC_MMAP1
	ddr_writel [expr $DDRC_CTRL_VALUE & 0xffff8fff] $DDRC_CTRL

}

proc phy_calibration {} {
	global INNO_TRAINING_CTRL
	global INNO_CALIB_DONE
	set m [phy_readl $INNO_TRAINING_CTRL]
	set m 0xa1
	phy_writel $m $INNO_TRAINING_CTRL
	while { 0x3 != [phy_readl $INNO_CALIB_DONE] } {
		set a [phy_readl $INNO_CALIB_DONE]
		#set a [phy_readl 0x10c]
		puts "aaaaaaaaaaaaaaa: $a"
		sleep 1
	}
	phy_writel 0xa0 $INNO_TRAINING_CTRL
}
proc ddrc_post_init {} {
	global DDRC_REFCNT_VALUE
	global DDRC_CTRL_VALUE
	global DDRC_REFCNT
	global DDRC_CTRL

	ddr_writel $DDRC_REFCNT_VALUE $DDRC_REFCNT
	ddr_writel $DDRC_CTRL_VALUE $DDRC_CTRL
}

proc ddrp_hardware_calibration {} {
	set timeout 0xffffff
	global DDRP_INNOPHY_TRAINING_CTRL
	global DDRP_TRAINING_CTRL_DSCSE_BP
	global DDRP_TRAINING_CTRL_DSACE_START
	global DDRP_INNOPHY_CALIB_DONE
	global DDR_PHY_OFFSET
	global DDRC_APB_OFFSET


	puts "DDRC_APB_OFFSET : $DDRC_APB_OFFSET"
	puts "DDR_PHY_OFFSET: $DDR_PHY_OFFSET"
	puts "DDRP_INNOPHY_TRAINING_CTRL: $DDRP_INNOPHY_TRAINING_CTRL"
	puts "DDRP_TRAINING_CTRL_DSCSE_BP: $DDRP_TRAINING_CTRL_DSCSE_BP"
	puts "DDRP_TRAINING_CTRL_DSACE_START: $DDRP_TRAINING_CTRL_DSACE_START"

	set value [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL]
	puts "DDRP_INNOPHY_TRAINING_CTRL: $value"
	set reg [expr [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL] & ~$DDRP_TRAINING_CTRL_DSCSE_BP]
	ddr_writel $reg $DDRP_INNOPHY_TRAINING_CTRL

	set value [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL]
	puts "DDRP_INNOPHY_TRAINING_CTRL: $value"
	set reg [expr [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL] | $DDRP_TRAINING_CTRL_DSACE_START]
	ddr_writel $reg $DDRP_INNOPHY_TRAINING_CTRL

	set value [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL]
	puts "DDRP_INNOPHY_TRAINING_CTRL: $value"
	while { !([expr [ddr_readl $DDRP_INNOPHY_CALIB_DONE] & 0x13] == 3) && $timeout} {
		set value [ddr_readl $DDRP_INNOPHY_CALIB_DONE]
		puts "aaaaaaaaaaaaa $value"
		set timeout [expr $timeout -1]
		sleep 1
	}
	if {$timeout == 0} {
		puts "ddrp_auto_calibration failed!"
	}
	set reg [expr [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL] & ~(1)]
	ddr_writel $reg $DDRP_INNOPHY_TRAINING_CTRL
	#set al [ddr_readl $DDRP_INNOPHY_CALIB_DELAY_AL]
	#set ah [ddr_readl $DDRP_INNOPHY_CALIB_DELAY_AH]

	set read_data0 [mrw [expr 0xb3011000 + (0x74 << 2)]]
	set read_data1 [mrw [expr 0xb3011000 + (0x75 << 2)]]
	set c0 [expr ($read_data0 >> 4) & 0x7]
	set c1 [expr ($read_data1 >> 4) & 0x7]

	#set max [max $c0, $c1]
	if {$c0 > $c1} {
		set max $c0
	} else {
		set max $c1
	}

	set cycsel [expr $max +1]
	set tmp [expr [expr [mrw [expr 0xb3011000 + (0xa << 2)]] & ~(7 << 1)] | ($cycsel << 1)]
	mww [expr 0xb3011000 + (0xa << 2)] $tmp

	set tmp [expr [mrw [expr 0xb3011000 + 0x4]] | (1 << 6)]
	mww [expr 0xb3011000 + (0x1 << 2)] $tmp

}

proc mem_remap { } {
	mww 0xb34f009c 0x03020c0b
	mww 0xb34f00a0 0x07060504
	mww 0xb34f00a4 0x000a0908
	mww 0xb34f00a8 0x0f0e0d01
	mww 0xb34f00ac 0x13121110
}

proc reset_dll { } {
	global CPM_DRCG
	#cpm_outl  [expr 0x3 | [expr 1 << 6]]  $CPM_DRCG
	#cpm_outl  [expr 0x7d | [expr 1 << 6]] $CPM_DRCG
	mww $CPM_DRCG [expr 0x3 | [expr 1 << 6]]
	sleep 100
	mww $CPM_DRCG [expr 0x7d | [expr 1 << 6]]
	sleep 100
}

proc reset_controller { } {
	#mww 0xb34f0008 [expr 0xf << 20]
	#mww 0xb34f0008 [expr 0x8 << 20]
	global DDRC_CTRL
	ddr_writel [expr 0xf << 20] $DDRC_CTRL
	sleep 100
	ddr_writel [expr 0x8 << 20] $DDRC_CTRL
	sleep 100

}

proc sdram_init { } {
	global DDR
	global CONFIG_SYS_MEM_FREQ

	clk_set_rate $DDR $CONFIG_SYS_MEM_FREQ
	puts "clk_set_rate"
	reset_dll
	puts "reset_dll"
	reset_controller
	puts "reset_controller"
	#prev_ddr_init
	#puts "prev_ddr_init"

	#DDR PHY init
	#ddr_phy_init
	ddr_inno_phy_init
	puts "ddr_inno_phy_init"
	ddrc_dfi_init
	puts "ddrc_dfi_init"
	#ddrp_wl_training
	ddrc_prev_init
	puts "ddrc_prev_init"
	#phy_calibration
	#puts "phy_calibration"
	ddrc_post_init
	puts "ddrc_post_init"
	sleep 500
	ddrp_hardware_calibration
	puts "ddrp_hardware_calibration"
}


proc ddrc_read {} {

	set value [ddr_readl $DDRP_INNOPHY_TRAINING_CTRL]
	puts "DDRP_INNOPHY_TRAINING_CTRL: $value"

}



proc sfc_init { } {
	mww 0xb0000074 [expr [expr [mrw 0xb0000074] & 0xE7FFFF00] | 0x20000003]
	while { [expr [mrw 0xb0000074] & 0x10000000] } {
		sleep 1
	}
}

proc cpu_init { } {
	#Invalidate BTB
	mips32 cp0 16 7 0x00000002

	#CU0=UM=EXL=IE=0, BEV=ERL=1, IP2~7=1
	mips32 cp0 12 0 0x0040FC04

	#CAUSE register
	#IV=1, use the specical interrupt vector (0x200)
	mips32 cp0 13 0 0x00800000

	#enable bridge radical mode
	mmw 0xb0000024 0x00000022 0x00000000

	#cacheable noncoherent write-back write-allocate
	mips32 cp0 16 0 0x00000003

	#enable idx-store-data cache insn
	mips32 cp0 26 0 0x20000000

	#init caches
	#mips32 invalidate allnowb
}

proc wdt_close { } {
	mww 0xb0002004 0x0
}

proc x1600_init { } {
	global INNO_CALIB_DONE
	cpu_init
	puts "cpu_init finish"
	gpio_init
	puts "gpio_init finish"
	timer_init
	puts "timer_init finish"
	clk_prepare
	puts "clk_init finish"
	pll_init
	puts "pll_init finish"
	clk_init
	puts "clk_init finish"
	sdram_init
	puts "sdram_init finish"
	sfc_init
	wdt_close
}
