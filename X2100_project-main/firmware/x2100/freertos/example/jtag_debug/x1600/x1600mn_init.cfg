proc prev_ddr_init { } {
	#auto DDR clk gating
	mww 0xb00000d0 0x00000073
	sleep 1
	mww 0xb00000d0 0x00000071
	sleep 1

	#reset phy dll dfi and cfg
	mww 0xb3012080 0x01a00001
	sleep 1
	mww 0xb3012080 0x00000000
	sleep 1
}

proc wait_ddrp_pgsr { wait_val timeout } {
	while { [expr [expr [mrw 0xb301100c] & $wait_val ] != $wait_val] && $timeout } {
		set timeout [expr $timeout - 1]
	}
	if { $timeout == 0 } {
		puts "DDR init timeout!"
		while { 1 } {
			sleep 1
		}
	}
}

