proc pll_get_rate { pll } {
	global CPM_CPAPCR
	global CPM_CPMPCR
	global CPM_CPEPCR
	global CONFIG_SYS_EXTAL
	set cpxpcr 0
	puts "pll $pll"
	switch $pll {
		13 {
			set cpxpcr [cpm_inl $CPM_CPAPCR]
			puts "APLL"
		}
		14 {
			set cpxpcr [cpm_inl $CPM_CPMPCR]
			puts "MPLL"
		}
		15 {
			set cpxpcr [cpm_inl $CPM_CPEPCR]
			puts "EPLL"
		}
		default {
			return 0
		}
	}
	set m [expr (($cpxpcr >> 20) & 0xfff)]
	set n [expr (($cpxpcr >> 14) & 0x3f)]
	set od1 [expr (($cpxpcr >> 11) & 0x7)]
	set od0 [expr (($cpxpcr >> 8) & 0x7)]
	set rate [expr $CONFIG_SYS_EXTAL /1000 /1000]
	set rate [expr $rate * $m /$n /$od1 /$od0]
	return [expr $rate * 1000 * 1000]
}

proc clk_set_rate { clk_id rate} {
	global cgusetting
	global MSC0
	global MSC1
	global CGU_CNT

	if {$clk_id >= $CGU_CNT} {
		return
	}
	set cgu $cgusetting($clk_id)
	set reg $cgu(addr)
	set pll_rate [pll_get_rate $cgu(sel_src)]
	if {!$pll_rate} {
		puts "get pull error"
	}
	set regval [mrw $reg]
	if { ($clk_id == $MSC0) || ($clk_id == $MSC1)} {
		set cdr [expr ((($pll_rate - $rate - 1) / rate) / 2 -1) & 0xff]

	} else {
		set cdr [expr (($pll_rate + $rate - 1) / $rate  -1) & 0xff]
	}

	set regval [expr $regval & ~((3 << $cgu(stop)) | 0xff)]
	set regval [expr $regval | ((1 << $cgu(ce)) | $cdr)]
	mww $reg $regval
	while { [expr [mrw $reg] & (1 << $cgu(busy))] } {
		sleep 1
	}
}

