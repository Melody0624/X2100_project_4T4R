proc cpm_inl { off } {
	global CPM_BASE
	set value [mrw [expr $CPM_BASE + $off]]
	return $value
}

proc cpm_outl { val off } {
	global CPM_BASE
	mww [expr $CPM_BASE + $off] $val
}

proc gost_readl { off } {
	global OST_BASE
	set val [mrw [expr $OST_BASE + $off]]
	return $val
}

proc gost_writel {val off} {
	global OST_BASE
	mww [expr $OST_BASE + $off] $val
}

proc reset_timer {} {
	global OST_TCR
	gost_writel 1 $OST_TCR
}

proc timer_init {} {
	global CPM_CLKGR0
	global CPM_CLKGR_OST
	global CONFIG_SYS_EXTAL
	global USEC_IN_1SEC
	global OST_DIV
	global OST_TECR
	global OSTCSR_PRESCALE
	global OST_TCCR
	global OST_TESR

	set gate0 [expr [cpm_inl $CPM_CLKGR0] & ~($CPM_CLKGR_OST)]
	cpm_outl $gate0 $CPM_CLKGR0

	set multiple [expr $CONFIG_SYS_EXTAL / $USEC_IN_1SEC / $OST_DIV]
	#Disable OST
	gost_writel 1 $OST_TECR
	#Configure OST
	gost_writel $OSTCSR_PRESCALE $OST_TCCR

	#Reset OST
	reset_timer

	#Start OST
	gost_writel 3 $OST_TESR
}

proc clk_prepare { } {
#	#stop clk and set div max
#
#	#DDR
#	set regval [mrw 0xb000002c]
#	set regval [expr $regval | 0x2800000f]
#	mww 0xb000002c $regval
#	while { [expr [mrw 0xb000002c] & 0x10000000] } {
#		sleep 1
#	}
#
#	#SSI
#	set regval [mrw 0xb000005c]
#	set regval [expr $regval | 0x2800000f]
#	mww 0xb0000074 $regval
#	while { [expr [mrw 0xb000005c] & 0x10000000] } {
#		sleep 1
#	}
	global cgusetting
	global MSC0
	global MSC1
	global CIM
	global CPM_OPCR

	set size [array size cgusetting]
	puts "size of cgusetting: $size"
	for {set i 0} {$i < $size} {incr i} {
		if { ($i == $MSC0) || ($i == $MSC1)} {
			continue
		}
		if {$i == $CIM} {
			cpm_outl [expr [cpm_inl $CPM_OPCR] & ~(1 << 5)] $CPM_OPCR
		}
		set dev $cgusetting($i)
		#puts "dev: $dev"
		set reg $dev(addr)
		#puts "reg address: $reg"
		set regval [mrw $reg]
		if {$dev(busy)} {
			set regval [expr $regval | $dev(val)]
			mww $reg $regval
			set timeout 0xfff
			while {[expr [mrw $reg] & (1 << $dev(busy)) && $timeout]} {
				set timeout [expr $timeout - 1]
				if {!$timeout} {
					continue
				}
			}
		} else {
			set regval [expr $regval & ~(1 << $dev(ce))]
			mww $reg $regval
		}
	}
}

