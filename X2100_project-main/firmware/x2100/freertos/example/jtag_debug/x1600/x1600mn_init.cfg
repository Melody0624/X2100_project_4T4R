	cpm_outl 0x55700000 $CPM_CPCCR
	while { [expr [cpm_inl $CPM_CPCSR] & 0xf0000007] != 0xf0000000 } {
		sleep 1
	}
}

proc pll_set { reg } {
	global CPM_CPAPCR
	global CPM_CPMPCR
	global CPM_CPEPCR
	global APLL_EN_VALUE
	global APLL_M_VALUE
	global APLL_N_VALUE
	global APLL_OD1_VALUE
	global APLL_OD0_VALUE

	global MPLL_EN_VALUE
	global MPLL_M_VALUE
	global MPLL_N_VALUE
	global MPLL_OD1_VALUE
	global MPLL_OD0_VALUE

	global EPLL_EN_VALUE
	global EPLL_M_VALUE
	global EPLL_N_VALUE
	global EPLL_OD1_VALUE
	global EPLL_OD0_VALUE


	set val [expr [cpm_inl $reg] & ~(1 << 0)]
	cpm_outl $val $reg
	puts "reg : $reg"
	puts "CPM_CPAPCR $CPM_CPAPCR"
	switch $reg {
		0x10 {
			set val [expr ($APLL_EN_VALUE << 0) | ($APLL_M_VALUE << 20) | ($APLL_N_VALUE << 14) | ($APLL_OD1_VALUE << 11) | ($APLL_OD0_VALUE << 8) | (1 << 7) | (1 << 6)]
			cpm_outl $val $CPM_CPAPCR
		}
		0x14 {
			set val [expr ($MPLL_EN_VALUE << 0) | ($MPLL_M_VALUE << 20) | ($MPLL_N_VALUE << 14) | ($MPLL_OD1_VALUE << 11) | ($MPLL_OD0_VALUE << 8) | (1 << 7) | (1 << 6)]
			cpm_outl $val $CPM_CPMPCR
		}
		0x18 {
			set val [expr ($EPLL_EN_VALUE << 0) | ($EPLL_M_VALUE << 20) | ($EPLL_N_VALUE << 14) | ($EPLL_OD1_VALUE << 11) | ($EPLL_OD0_VALUE << 8) | (1 << 7) | (1 << 6)]
			cpm_outl $val $CPM_CPEPCR
		}
		default {
			puts "pll reg\[$reg\] $val not recognise!"
		}
	}
	set timeout 0x10000
	while {[expr !([cpm_inl $reg] & (1 << 3))] && $timeout} {
		set timeout [expr $timeout -1]
		sleep 1
	}
	if {$timeout == 0} {
		puts "pll reg[0x$reg] val[0x$val] setting timeout!"
	}
}


proc pll_sets { } {
	global APLL_EN_VALUE
	global MPLL_EN_VALUE
	global EPLL_EN_VALUE
	global CPM_CPAPCR
	global CPM_CPMPCR
	global CPM_CPEPCR
	if {$APLL_EN_VALUE} {
		pll_set $CPM_CPAPCR
	}
	if {$MPLL_EN_VALUE} {
		pll_set $CPM_CPMPCR
	}
	if {$EPLL_EN_VALUE} {
		pll_set $CPM_CPEPCR
	}
}

proc cpccr_sets { } {
	##set val 0x55752210
	#set val 0x55773310
	##CPM_CPCCR
	#mww 0xb0000000 $val
	#while { [expr [mrw 0xb00000d4] & 0x00000007] } {
	#	sleep 1
	#}
	##set val 0x9a052210
	#set val 0x9a073310
	##CPM_CPCCR
	#mww 0xb0000000 $val
	#while { [expr ![expr [mrw 0xb00000d4] & 0xf0000000]] } {
	#	sleep 1
	#}
	global CDIV_REG_VALUE
	global L2DIV_REG_VALUE
	global H0DIV_REG_VALUE
	global H2DIV_REG_VALUE
	global PDIV_REG_VALUE
	global CPM_CPCCR
	global CPM_CPCSR
	global SEL_SRC_REG_VALUE
	global SEL_CPLL_REG_VALUE
	global SEL_H0PLL_REG_VALUE
	global SEL_H2PLL_REG_VALUE
	global CDIV_REG_VALUE
	global L2DIV_REG_VALUE
	global H0DIV_REG_VALUE
	global H2DIV_REG_VALUE
	global PDIV_REG_VALUE
	set val [expr 0x55700000 | \
					($CDIV_REG_VALUE  << 0) | \
					($L2DIV_REG_VALUE << 4) | \
					($H0DIV_REG_VALUE << 8) | \
					($H2DIV_REG_VALUE << 12)| \
					($PDIV_REG_VALUE  << 16)]
	cpm_outl $val $CPM_CPCCR
	while {[expr [cpm_inl $CPM_CPCSR] & 7]} {
		sleep 1
	}
	set val [expr ($SEL_SRC_REG_VALUE << 30) | \
				  ($SEL_CPLL_REG_VALUE  << 28) |\
				  ($SEL_H0PLL_REG_VALUE << 26) |\
				  ($SEL_H2PLL_REG_VALUE << 24) |\
				  ($CDIV_REG_VALUE  <<  0) |\
				  ($L2DIV_REG_VALUE <<  4) |\
				  ($H0DIV_REG_VALUE <<  8) |\
				  ($H2DIV_REG_VALUE << 12) |\
				  ($PDIV_REG_VALUE <<  16)]
	cpm_outl $val $CPM_CPCCR

	while {[expr [cpm_inl $CPM_CPCSR] & 0xf0000000] != 0xf0000000} {
		sleep 1
	}
	set val [cpm_inl $CPM_CPCCR]
	puts "CPM_CPCCR: $val"
}

