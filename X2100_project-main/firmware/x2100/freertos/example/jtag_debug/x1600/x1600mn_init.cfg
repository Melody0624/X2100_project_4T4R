proc ddr_phy_init_dram { } {
	set timeout 0x00002710
	set pir_val 0x20020051
	set wait_val 0x00000009
	#DLL Disable: only bypassmode
	mww 0xb3011014 0x80000000
	#200M bypass.
	set val [mrw 0xb3011010]
	set val [expr $val | 0x00800000]
	mww 0xb3011010 $val

	#LPDLLPD:  only for ddr bypass mode
	#Low Power DLL Power Down: Specifies if set that the PHY should respond to the
	#DFI low power opportunity request and power down the DLL of the PHY if the
	#wakeup time request satisfies the DLL lock time
	set val [mrw 0xb301102c]
	set val [expr $val & 0xffffffef]
	mww 0xb301102c $val
	wait_ddrp_pgsr 0x00000007 0x00010000
	mww 0xb3011004 $pir_val
	wait_ddrp_pgsr $wait_val $timeout
}

proc reset_controller { } {
	#mww 0xb3012080 0x00400000
	#sleep 1
	#mww 0xb3012080 0x00000000
	#sleep 1
	global DDRC_CTRL
	ddr_writel $DDRC_CTRL [expr 0xf << 20]
	sleep 5
	ddr_writel $DDRC_CTRL [expr 0x8 << 20]
	sleep 5
}

proc force_no_slefresh { } {
	#force CKE1 CS1 HIGH
	#mww 0xb34f0004 0x094689c0
	mww 0xb34f0008 0x00000002
}

proc ddr_training_hardware { } {
	set timeout 0x0007A120
	set pir_val 0x20020081
	set wait_val 0x00000011
	mww 0xb3011004 $pir_val
	wait_ddrp_pgsr $wait_val $timeout
	set result [mrw 0xb301100c]
	if { [expr $result & 0x00000060] } {
		puts "DDR hardware training error!"
	} else {
		set result 0x00000000
	}
	return $result
}

proc ddr_phy_init { } {
	mww 0xb3011054 0x00150000
	#DDR training address set
	ddr_phy_param_config
	ddr_phy_init_dram

	reset_controller
	force_no_slefresh
	set ret [ddr_training_hardware]
	if { $ret } {
		while { 1 } {
			sleep 1
		}
	}
}
