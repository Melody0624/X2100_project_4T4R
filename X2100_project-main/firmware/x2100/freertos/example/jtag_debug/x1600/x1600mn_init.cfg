proc mrw { reg } {
	set value ""
	mem2array value 32 $reg 1
	return $value(0)
}

proc mmw { reg setbits clearbits } {
	set old [mrw $reg]
	set new [expr ($old & ~$clearbits) | $setbits]
	mww $reg $new
}

proc ddr_writel { value reg } {
	#global DDRC_BASE 0xb34f0000
	global DDRC_BASE
	mww [expr $DDRC_BASE + $reg] $value
}

proc ddr_readl { reg } {
	#set DDRC_BASE 0xb34f0000
	global DDRC_BASE
	set value [mrw [expr $DDRC_BASE + $reg]]
	return $value
}

proc phy_writel { value reg } {
	#set phy_base 0xb3011000
	global PHY_BASE
	mww [expr $PHY_BASE + $reg] $value
}

proc phy_readl { reg } {
	#set ddrc_base 0xb3011000
	global PHY_BASE
	set value [mrw [expr $PHY_BASE + $reg]]
	return $value
}

